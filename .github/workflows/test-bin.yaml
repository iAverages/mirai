name: "test"

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Mic92/niks3-action@v1
        continue-on-error: true
        with:
          server-url: https://niks3.kirsi.dev
          skip-push: ${{ github.ref != 'refs/heads/main' }}
      - run: nix develop
      - run: cargo test
